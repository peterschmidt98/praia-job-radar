# Watched companies with a job board the scanner reads directly (replit.md, step 1).
#
# Updated 19 Nov 2026: 27 original entries re-checked, plus 80 Dutch scale-ups found by a research agent
# and independently re-checked by a second agent (company status, NL office, job board, posting language).
#
# Fields
#   ats:      greenhouse | lever | ashby | smartrecruiters | recruitee | workable | personio | null
#             null = no readable board (Workday, Teamtailor, HiBob, custom site...). The company is still
#             found via LinkedIn/Indeed; keep it here so it counts as a watched company.
#   slug:     board name for that ATS.
#   host:     eu  -> use the EU API host first (boards-api.eu.greenhouse.io / api.eu.lever.co),
#             then fall back to the global host.
#   base_url: Recruitee on the company's own domain -> fetch {base_url}/api/offers/ instead of
#             https://{slug}.recruitee.com/api/offers/. Unverified: if it returns no JSON, mark the board dead.
#   posts_in: en | nl | mixed | unknown  (language of their job postings; she has no Dutch)
#   careers:  human careers page, for reference.
#   tier:     A = very likely to hire Sales Ops / RevOps / CRM roles in English in NL
#             B = plausible, C = long shot or unverified.
#
# Before trusting a slug, run discover.py over this file: it must return jobs for that company.
# A Recruitee slug that 302-redirects to https://recruitee.com/ is dead (board removed).
# A redirect to another *.recruitee.com subdomain is a rename: follow it and update the slug.

